<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GoFly – Wettercheck</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="style.css" />
  <style>
    #output {
      margin-top: 2rem;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .card {
      background-color: #f3f3f3;
      padding: 2rem 1.5rem 3rem 1.5rem;
      border-radius: 20px;
      white-space: pre-wrap;
      line-height: 1.3;
      box-shadow: 1px 1px 3px rgba(0, 0, 0, 0.2);
    }

    .card.error {
      border-color: #ef4444;
      color: #fca5a5;
      font-family: monospace;
      font-size: 0.85rem;
    }

    .card.today {
      border-left: 4px solid #4CAF50;
    }

    .card.tomorrow {
      border-left: 4px solid #81C784;
    }

    .card.day-after {
      border-left: 4px solid #C8E6C9;
    }

    .meta {
      font-size: 1rem;
      color: #273241;
      padding: 0.25rem 0 0 0.5rem;
    }

    .block-sep {
      margin: 0.5rem 2rem 0.3rem 2rem;
      background: rgb(213 213 213);
      height: 1px;
      border: 0;
    }
  </style>
</head>


<body>
  <h1>🪂 GoFly Wettercheck</h1>
  <p style="margin-bottom:1rem;margin-top:-0.75rem;font-size:0.85rem;opacity:0.55"><a href="/spots.html"
      style="color:inherit">🏔️ Startplätze verwalten</a></p>
  <button id="btn" onclick="runCheck()">Daten abrufen</button>
  <div id="output"></div>

  <script>
    async function loadLastResults() {
      const res = await fetch("/api/results");
      const data = await res.json();
      if (!data?.messages?.length) return;
      const output = document.getElementById("output");
      output.innerHTML = "";
      const meta = document.createElement("p");
      meta.style = "font-size:0.8rem;opacity:0.5;margin-bottom:0.5rem";
      meta.textContent = `Letzter Check: ${new Date(data.updated_at).toLocaleString("de-DE")}`;
      output.appendChild(meta);
      addCard(data.messages.map(m => m.text).join("\n\n\n"), "telegram");
    }

    loadLastResults();
    // Live-reload
    const lr = new EventSource("/livereload");
    lr.onmessage = (e) => { if (e.data === "reload") location.reload(); };
    function runCheck() {
      const btn = document.getElementById("btn");
      const output = document.getElementById("output");

      btn.disabled = true;
      output.innerHTML = "";

      const es = new EventSource("/run");
      let telegramBuffer = "";
      let inTelegram = false;

      es.onmessage = (e) => {
        const msg = JSON.parse(e.data);

        if (msg.type === "done") {
          es.close();
          btn.disabled = false;
          // Flush remaining telegram buffer
          if (telegramBuffer.trim()) {
            addCard(telegramBuffer.trim(), "telegram");
            telegramBuffer = "";
          }
          return;
        }

        const text = msg.text;

        if (msg.type === "error") {
          addCard(text, "error");
          return;
        }

        // Detect Telegram message block
        if (text.startsWith("=== Telegram-Nachricht ===")) {
          inTelegram = true;
          telegramBuffer = "";
          return;
        }
        if (text.startsWith("[DRY RUN]") || text === "Nachricht gesendet." || text.startsWith("Keine geeigneten")) {
          if (telegramBuffer.trim()) {
            addCard(telegramBuffer.trim(), "telegram");
            telegramBuffer = "";
          }
          inTelegram = false;
          if (text.startsWith("Keine geeigneten")) {
            addCard(text, "log");
          }
          return;
        }
        if (inTelegram) {
          telegramBuffer += text + "\n";
          return;
        }

        // ignore all other debug output
      };

      es.onerror = () => {
        es.close();
        btn.disabled = false;
        addCard("Fehler beim Abrufen der Daten.", "error");
      };
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/&lt;b&gt;/g, "<b>")
        .replace(/&lt;\/b&gt;/g, "</b>");
    }

    function addCard(text, type) {
      const output = document.getElementById("output");
      if (type === "telegram") {
        const dateOpts = { weekday: "long", day: "numeric", month: "long" };
        const todayLabel = new Date().toLocaleDateString("de-DE", dateOpts);
        const tomorrowLabel = new Date(Date.now() + 86400000).toLocaleDateString("de-DE", dateOpts);
        const dayAfterLabel = new Date(Date.now() + 2 * 86400000).toLocaleDateString("de-DE", dateOpts);

        const spots = text.split(/\n\n\n/);
        for (const spot of spots) {
          if (!spot.trim()) continue;
          const parts = spot.trim().split(/\n\n/);
          const card = document.createElement("div");
          const isToday = spot.includes(`${todayLabel}`);
          const isTomorrow = spot.includes(`${tomorrowLabel}`);
          const isDayAfter = spot.includes(`${dayAfterLabel}`);
          const extraClass = isToday ? " today" : isTomorrow ? " tomorrow" : isDayAfter ? " day-after" : "";
          card.className = "card telegram" + extraClass;
          let html = "";
          for (let pi = 0; pi < parts.length; pi++) {
            if (pi > 0) html += `<hr class="block-sep">`;
            const lines = parts[pi].trim().split("\n");
            for (const line of lines) {
              if (line.startsWith("🪂")) {
                const escaped = escapeHtml(line.replace(/🪂\s*/, ""));
                html += `<h2>🪂 ${escaped}</h2>`;
              } else {
                html += `<p class="meta">${escapeHtml(line)}</p>`;
              }
            }
          }
          card.innerHTML = html;
          output.appendChild(card);
        }
      } else {
        const card = document.createElement("div");
        card.className = `card ${type}`;
        card.textContent = text;
        output.appendChild(card);
      }
    }
  </script>
</body>

</html>
