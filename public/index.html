<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GoFly – Wettercheck</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="style.css" />
  <style>
    #output {
      margin-top: 2rem;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .card {
      background-color: #f3f3f3;
      padding: 2rem 1.5rem 3rem 1.5rem;
      border-radius: 20px;
      white-space: pre-wrap;
      line-height: 1.3;
      box-shadow: 1px 1px 3px rgba(0, 0, 0, 0.2);
    }

    .card.error {
      border-color: #ef4444;
      color: #fca5a5;
      font-family: monospace;
      font-size: 0.85rem;
    }

    .card.today {
      border-left: 4px solid #4CAF50;
    }

    .card.tomorrow {
      border-left: 4px solid #81C784;
    }

    .card.day-after {
      border-left: 4px solid #A5D6A7;
    }

    .meta {
      font-size: 1rem;
      color: #273241;
      padding: 0.25rem 0 0 0.5rem;
    }

    .block-sep {
      margin: 0.5rem 2rem 0.3rem 2rem;
      background: rgb(213 213 213);
      height: 1px;
      border: 0;
    }
  </style>
</head>


<body>
  <h1>🪂 GoFly Wettercheck</h1>
  <p style="margin-bottom:1rem;margin-top:-0.75rem;font-size:0.85rem;opacity:0.55"><a href="/spots.html"
      style="color:inherit">🏔️ Startplätze verwalten</a></p>
  <button id="btn" onclick="runCheck()">Daten abrufen</button>
  <div id="output"></div>

  <script>
    async function loadLastResults() {
      const res = await fetch("/api/results");
      const data = await res.json();
      if (!data?.messages?.length) return;
      const output = document.getElementById("output");
      output.innerHTML = "";
      const meta = document.createElement("p");
      meta.style = "font-size:0.8rem;opacity:0.5;margin-bottom:0.5rem";
      meta.textContent = `Letzter Check: ${new Date(data.updated_at).toLocaleString("de-DE")}`;
      output.appendChild(meta);
      renderStructuredMessages(data.messages);
    }

    loadLastResults();
    // Live-reload
    const lr = new EventSource("/livereload");
    lr.onmessage = (e) => { if (e.data === "reload") location.reload(); };
    function runCheck() {
      const btn = document.getElementById("btn");
      const output = document.getElementById("output");

      btn.disabled = true;
      output.innerHTML = "";

      const es = new EventSource("/run");

      es.onmessage = (e) => {
        const msg = JSON.parse(e.data);

        if (msg.type === "done") {
          es.close();
          btn.disabled = false;
          loadLastResults().catch(() => {
            addTextCard("Fehler beim Laden der aktualisierten Ergebnisse.", "error");
          });
          return;
        }

        const text = msg.text;

        if (msg.type === "error") {
          addTextCard(text, "error");
          return;
        }

        if (text.startsWith("Keine geeigneten")) {
          addTextCard(text, "log");
          return;
        }

        // ignore all other debug output
      };

      es.onerror = () => {
        es.close();
        btn.disabled = false;
        addTextCard("Fehler beim Abrufen der Daten.", "error");
      };
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/&lt;b&gt;/g, "<b>")
        .replace(/&lt;\/b&gt;/g, "</b>");
    }

    function relativeDayToClass(relativeDay) {
      if (relativeDay === "today") return "today";
      if (relativeDay === "tomorrow") return "tomorrow";
      if (relativeDay === "day_after") return "day-after";
      return "";
    }

    function getRelativeDayLabel(relativeDay) {
      if (relativeDay === "today") return "Heute";
      if (relativeDay === "tomorrow") return "Morgen";
      if (relativeDay === "day_after") return "Übermorgen";
      return "";
    }

    function extractShortDateLabel(message) {
      if (message?.dateLabel) {
        return message.dateLabel.replace(/^[^,]+,\s*/, "").trim();
      }
      if (message?.dateStr) {
        const d = new Date(`${message.dateStr}T00:00:00`);
        return d.toLocaleDateString("de-DE", { day: "numeric", month: "long" });
      }
      return "";
    }

    function formatDisplayDateLabel(message) {
      const rel = getRelativeDayLabel(message.relativeDay);
      const datePart = extractShortDateLabel(message);
      if (rel && datePart) return `📅 ${rel}, ${datePart}`;
      if (rel) return `📅 ${rel}`;
      if (datePart) return `📅 ${datePart}`;
      return "";
    }

    function renderStructuredMessages(messages) {
      const output = document.getElementById("output");
      for (const msg of messages) {
        if (!msg || !Array.isArray(msg.blocks) || !msg.summary) continue;
        const extraClass = relativeDayToClass(msg.relativeDay);
        const card = document.createElement("div");
        card.className = `card telegram${extraClass ? ` ${extraClass}` : ""}`;

        let html = `<h2>🪂 ${escapeHtml(msg.spotName || "Unbekannter Spot")}</h2>`;
        const dateLine = formatDisplayDateLabel(msg);
        if (dateLine) {
          html += `<p class="meta">${escapeHtml(dateLine)}</p>`;
        }

        for (let i = 0; i < msg.blocks.length; i++) {
          const b = msg.blocks[i];
          if (i > 0) html += `<hr class="block-sep">`;
          const timeLabel = b.startHour === b.endHour
            ? `${b.startHour}:00 Uhr`
            : `${b.startHour}–${b.endHour} Uhr`;
          html += `<p class="meta">${escapeHtml(`🕐 ${timeLabel} Ø ${b.avgWind} km/h 💨 ${b.avgDirectionLabel}`)}</p>`;
          html += `<p class="meta">${escapeHtml(`🌬️ Böen: max ${b.maxGusts} km/h`)}</p>`;
        }

        html += `<hr class="block-sep">`;
        html += `<p class="meta">${escapeHtml(`☁️ Bewölkung: Ø ${msg.summary.avgCloud}%`)}</p>`;
        html += `<p class="meta">${escapeHtml(`🌧️ ${msg.summary.rainRisk}`)}</p>`;
        html += `<p class="meta">${escapeHtml(`⛈️ ${msg.summary.thunderRisk}`)}</p>`;

        card.innerHTML = html;
        output.appendChild(card);
      }
    }

    function addTextCard(text, type) {
      const output = document.getElementById("output");
      const card = document.createElement("div");
      card.className = `card ${type}`;
      card.textContent = text;
      output.appendChild(card);
    }
  </script>
</body>

</html>
